<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Url- Shortener </title>
    <link rel="icon" type="image/jpeg" href="images/icon.jpg">
    <!-- <img src="images/icon.jpg" alt="Shawtly Logo" id="logo"> -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1 id ="heading">Shawtly</h1>
    <h2 id ="tt">Why use longer links , When you can make them shawtly </h2>
    <div class="url-enter">
        <input type ="text" id="urlIn" placeholder = "Enter the url son" >
        <button type = "button" id = "short" > Shorten Url</button>
        <p id = "sht">Your shortened URL will appear here.</p>
         <div class="actions">
            <button id="copy">Copy</button>
            <button id="qr">QR Code</button>
            <button id="share" aria-expanded="false" aria-controls="shareMenu">Share</button>
        </div>
        <div id="shareMenu" class="share-menu" hidden>
            <button type="button" id="nativeShare">Share Sheet</button>
            <a id="shareWhatsapp" href="#" target="_blank" rel="noopener">WhatsApp</a>
            <a id="shareX" href="#" target="_blank" rel="noopener">X</a>
            <button type="button" id="shareInstagram">Instagram</button>
        </div>
    </div>
    <div id="qrCode"></div>
    <script src = "script.js"></script>
</body>
</html>
